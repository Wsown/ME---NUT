    <polygon points="32,12 49,22 49,42 32,52 15,42 15,22" stroke="url(#logoCyan)" stroke-width="2.25" stroke-linejoin="round" opacity="0.9"/>
    <path d="M19 41 L29 29 L37 34 L46 19" stroke="#FFFFFF" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 19 L46 19 L46 30" stroke="url(#logoCoral)" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="19" cy="41" r="3.25" fill="#22D3EE"/>
    <circle cx="29" cy="29" r="2.75" fill="#FFFFFF"/>
    <circle cx="46" cy="19" r="3.75" fill="#FB7185"/>
  </g>
  <g id="wordmark">
