    <circle cx="117" cy="26" r="3.5" fill="#F43F5E"/>
    <text x="125" y="34" font-family="'Plus Jakarta Sans', 'Be Vietnam Pro', system-ui, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.5" fill="#1D4ED8">NUT</text>
    <text x="75" y="51" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#64748B">CƠ ĐIỆN TỬ VIỆT – NHẬT</text>
